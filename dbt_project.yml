name: 'nyc_taxi'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  nyc_taxi:

    bronze:
      +materialized: view
      +schema: BRONZE

    silver:
      +materialized: table
      +schema: SILVER

    gold:
      +materialized: table
      +schema: GOLD