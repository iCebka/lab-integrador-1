services:
  
  kestra-db:
    image: postgres:17-alpine
    volumes:
      - kestra-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${K_POSTGRES_DB}
      - POSTGRES_USER=${K_POSTGRES_USER}
      - POSTGRES_PASSWORD=${K_POSTGRES_PASSWORD}

  
  kestra:
    image: kestra/kestra:v1.3.37
    user: "root"
    command: ["server", "standalone"]
    ports:
      - 8080:8080
    environment:
      KESTRA_CONFIGURATION: &common_conf |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-db:5432/kestra
            driver-class-name: org.postgresql.Driver
            username: kestra
            password: kestra
        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd-tmp
        url:
          http://localhost:8080
    volumes:
      - kestra-storage:/app/storage
    depends_on:
      - kestra-db


volumes:
  kestra-db-data:
  kestra-storage: