version: 2

models:

  - name: dim_vendor
    description: >
      Vendor dimension derived from vendor identifiers present
      in the cleaned Yellow Taxi trips.

    columns:
      - name: vendor_key
        description: Primary key of the vendor dimension.
        data_tests:
          - not_null
          - unique

      - name: vendor_id
        description: Vendor identifier from the source data.
        data_tests:
          - not_null


  - name: dim_payment
    description: >
      Payment dimension derived from payment type identifiers
      present in the cleaned Yellow Taxi trips.

    columns:
      - name: payment_key
        description: Primary key of the payment dimension.
        data_tests:
          - not_null
          - unique

      - name: payment_type
        description: Payment type identifier from the source data.
        data_tests:
          - not_null


  - name: dim_rate_code
    description: >
      Rate code dimension derived from rate codes present
      in the cleaned Yellow Taxi trips.

    columns:
      - name: rate_code_key
        description: Primary key of the rate code dimension.
        data_tests:
          - not_null
          - unique

      - name: ratecode_id
        description: Rate code identifier from the source data.
        data_tests:
          - not_null


  - name: dim_location
    description: >
      Location dimension containing every pickup or dropoff
      location identifier present in the cleaned trips.

    columns:
      - name: location_key
        description: Primary key of the location dimension.
        data_tests:
          - not_null
          - unique

      - name: location_id
        description: TLC location identifier from the source data.
        data_tests:
          - not_null


  - name: dim_date
    description: >
      Calendar dimension constructed from pickup and dropoff dates
      present in the cleaned trips.

    columns:
      - name: date_key
        description: Primary key in YYYYMMDD numeric format.
        data_tests:
          - not_null
          - unique

      - name: date_day
        description: Calendar date.
        data_tests:
          - not_null

      - name: year
        data_tests:
          - not_null

      - name: quarter
        data_tests:
          - not_null

      - name: month_number
        data_tests:
          - not_null

      - name: day_of_month
        data_tests:
          - not_null

      - name: day_of_week
        data_tests:
          - not_null

      - name: is_weekend
        data_tests:
          - not_null


  - name: fact_trips
    description: >
      Fact table at the grain of one cleaned and deduplicated
      Yellow Taxi trip.

    columns:

      - name: trip_key
        description: Logical primary key of the trip fact.
        data_tests:
          - not_null
          - unique


      - name: vendor_key
        description: Foreign key to dim_vendor.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendor')
                field: vendor_key


      - name: payment_key
        description: Foreign key to dim_payment.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment')
                field: payment_key


      - name: rate_code_key
        description: Foreign key to dim_rate_code.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rate_code')
                field: rate_code_key


      - name: pickup_location_key
        description: Pickup location foreign key to dim_location.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key


      - name: dropoff_location_key
        description: Dropoff location foreign key to dim_location.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key


      - name: pickup_date_key
        description: Pickup date foreign key to dim_date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key


      - name: dropoff_date_key
        description: Dropoff date foreign key to dim_date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key


      - name: pickup_datetime
        data_tests:
          - not_null

      - name: dropoff_datetime
        data_tests:
          - not_null

      - name: passenger_count
        data_tests:
          - not_null

      - name: trip_distance
        data_tests:
          - not_null

      - name: trip_duration_seconds
        data_tests:
          - not_null

      - name: fare_amount
        data_tests:
          - not_null

      - name: total_amount
        data_tests:
          - not_null

      - name: source_period
        data_tests:
          - not_null